<!DOCTYPE html>

    <nav class="nav" id="nav">

        Visão Geral
      </a>
      <a href="regional.html" data-page="regional" class="active">
        <svg viewBox="0 0 24 24"><path d="M9 3 4 5v16l5-2 6 2 5-2V3l-5 2-6-2Z"/><path d="M9 3v16M15 5v16"/></svg>
        Análise Regional
      </a>
      <a href="tendencias.html" data-page="tendencias" >

    <div class="side-foot">

  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
        <input type="text" placeholder="Pesquisar município..." id="searchInput">
      </div>
      <div class="spacer"></div>
      <div class="ticons">
        <button title="Notificações"><span class="dot"></span><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></button>
        <button title="Ajuda"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 .3c0 1.7-2.5 2-2.5 3.7"/><circle cx="12" cy="17" r=".6" fill="#5d6b82" stroke="none"/></svg></button>
        <button title="Configurações"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.4l2-1.5-2-3.5-2.3 1a7 7 0 0 0-2.4-1.4L13.8 2h-3.6l-.4 2.7A7 7 0 0 0 7.4 6L5 5 3 8.5l2 1.5A7 7 0 0 0 5 12c0 .5 0 1 .1 1.4l-2 1.5 2 3.5 2.3-1a7 7 0 0 0 2.4 1.4l.4 2.7h3.6l.4-2.7a7 7 0 0 0 2.4-1.4l2.3 1 2-3.5-2-1.5c0-.4.1-.9.1-1.4Z"/></svg></button>
      </div>
      <div class="divider"></div>
      <div class="user"><b>Dra. Adrielly Costa</b><span>GESTORA FEDERAL</span></div>
    </header>

<section class="view" id="view-regional">
      <h2 class="page-title">Distribuição Geográfica de Casos</h2>
      <div class="row2">
        <div class="card card-pad">
          <div class="mapwrap clickable" id="regmap"></div>
        </div>
        <div id="regside"></div>
      </div>
    </section>

  </div>
</div>

<div class="maptip" id="maptip"></div>
<div class="chart-tip" id="charttip"></div>

<script src="../js/script.js"></script>
